            - generic [ref=f42e40]:
              - heading "About the Art" [level=2] [ref=f42e41]
              - generic [ref=f42e43]: Dhokra is a traditional non-ferrous metal casting art that uses the lost-wax technique, a method that dates back over 4000 years to the Indus Valley Civilization. The most famous early example of this technique is the dancing girl of Mohenjo-Daro. The artisans, traditionally from the Dhokra Damar tribes, create intricate, rustic, and expressive sculptures of local deities, animals, and scenes from daily life. Every piece is entirely unique because the clay mold must be broken to extract the final metal object, meaning no two Dhokra items are ever exactly alike. Today, this craft thrives in Chhattisgarh, West Bengal, and Odisha. The raw, primal aesthetic of Dhokra art continues to captivate art lovers worldwide, serving as a stunning testament to India's ancient metallurgical heritage.
